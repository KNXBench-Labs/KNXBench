# Scratch knx homes for everything Cargo runs (`cargo test`, `cargo run`,
# build scripts): a test or a dev build must never read, migrate or write the
# developer's real `~/.local/share/knx` and `~/.config/knx`. `force = true`
# because desktop sessions and CI runner images export the real homes, which
# would otherwise win. Opt out per command with
# `--config env.XDG_DATA_HOME.force=false` (the exported value applies again;
# the package gate does this for its own scratch homes). Release artifacts
# never read this file. See docs/DEVELOPER_PITFALLS.md#gates.
[env]
XDG_DATA_HOME = { value = "target/dev-home/data", relative = true, force = true }
XDG_CONFIG_HOME = { value = "target/dev-home/config", relative = true, force = true }
