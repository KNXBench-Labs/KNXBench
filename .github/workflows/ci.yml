name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Frontend install
        run: |
          cd apps/knx-web
          npm ci

      - name: Frontend tests
        run: |
          cd apps/knx-web
          npm test

      - name: Frontend build
        run: |
          cd apps/knx-web
          npm run build

      - name: ts-rs bindings up to date
        run: |
          TS_RS_EXPORT_DIR=../../apps/knx-web/src/bindings cargo test -p knx-projection
          git diff --exit-code -- apps/knx-web/src/bindings

      - name: Layering gate
        run: cargo run -p xtask -- check-layering

      - name: Header gate
        run: cargo run -p xtask -- check-headers

  deny:
    name: License and advisory gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
