name: Docker release

# Publishes the knx-server image to Docker Hub for every release tag (ADR-0097).
#
# A tag push `v*` is the trigger, the same one the AppImage release uses. A
# `release: published` trigger would never fire here: the GitHub release is
# created by linux-appimage.yml with GITHUB_TOKEN, and events caused by that
# token do not start other workflows.
#
# workflow_dispatch is a dry run: both architectures are built and
# smoke-tested, nothing is pushed. Configured credentials authenticate base pulls.
#
# Needs, before the first tag: repository variable DOCKERHUB_USERNAME and
# repository secret DOCKERHUB_TOKEN (a Docker Hub access token with read and
# write scope on knxbench/knxbench-server).

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: docker.io/knxbench/knxbench-server

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          # Native Arm runner: no QEMU, so the Rust build runs at full speed.
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
      HAVE_DOCKERHUB_LOGIN: ${{ vars.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      # Fail before a long build, not after it.
      - name: Check release tag and Docker Hub credentials
        if: env.PUBLISH == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[-PRERELEASE]"
            exit 1
          fi
          if [[ -z "$DOCKERHUB_USERNAME" ]]; then
            echo "::error::repository variable DOCKERHUB_USERNAME is not set"
            exit 1
          fi
          if [[ -z "$DOCKERHUB_TOKEN" ]]; then
            echo "::error::repository secret DOCKERHUB_TOKEN is not set"
            exit 1
          fi

      - uses: actions/checkout@v7

      # .dockerignore drops .git, so the commit travels as a build argument.
      - name: Commit for knx-server --version
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      - uses: docker/setup-buildx-action@v4

      # Authenticate base-image pulls too; publication remains tag-only.
      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true' || env.HAVE_DOCKERHUB_LOGIN == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/knx-server/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: KNX_BUILD_SHA=${{ steps.sha.outputs.short }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: knxbench-server:ci
          load: true
          provenance: false
          sbom: false

      - name: Smoke test the image
        env:
          KNXBENCH_IMAGE: knxbench-server:ci
        run: apps/knx-server/scripts/smoke-test.sh

      # Same inputs as the tested build, so every layer comes from the
      # builder's cache: what is pushed is what was smoke-tested.
      - name: Push by digest
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/knx-server/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: KNX_BUILD_SHA=${{ steps.sha.outputs.short }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true

      - name: Record digest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          test -n "$DIGEST"
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
          echo "${{ matrix.platform }}: \`$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload digest
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-arch image
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      # Every release tag, pre-releases included, moves `latest` (owner
      # decision 2026-10-09, while only alphas exist). {{version}} drops the
      # leading v: v0.1.0-alpha.6 -> 0.1.0-alpha.6.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Create and push the manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          shopt -s nullglob
          digests=(*)
          if [[ ${#digests[@]} -ne 2 ]]; then
            echo "::error::expected 2 platform digests, got ${#digests[@]}"
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          jq -e --arg tag "$IMAGE:$version" '.tags | index($tag)' \
            <<< "$DOCKER_METADATA_OUTPUT_JSON" >/dev/null \
            || { echo "::error::metadata produced no $version tag"; exit 1; }
          mapfile -t tag_args < <(jq -r '.tags[] | "--tag", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          mapfile -t annotation_args < <(jq -r '.annotations[] | "--annotation", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in "${digests[@]}"; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tag_args[@]}" "${annotation_args[@]}" "${sources[@]}"

      - name: Verify the published image
        run: |
          version="${GITHUB_REF_NAME#v}"
          for tag in "$version" latest; do
            platforms=$(docker buildx imagetools inspect "$IMAGE:$tag" --raw \
              | jq -r '[.manifests[] | select(.platform.os == "linux") | "\(.platform.os)/\(.platform.architecture)"] | sort | join(",")')
            echo "$IMAGE:$tag -> $platforms"
            test "$platforms" = "linux/amd64,linux/arm64"
          done
          {
            echo "### Docker Hub"
            echo
            echo "\`docker pull $IMAGE:$version\` (also \`latest\`), linux/amd64 + linux/arm64."
          } >> "$GITHUB_STEP_SUMMARY"
