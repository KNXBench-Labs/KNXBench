name: Linux AppImage

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            wget \
            xauth \
            xvfb

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked

      - name: Install frontend dependencies
        run: npm ci --prefix apps/knx-web

      - name: Build AppImage
        working-directory: apps/knx-desktop
        env:
          NO_STRIP: "1"
        run: APPIMAGE_EXTRACT_AND_RUN=1 cargo tauri build --bundles appimage --ci

      - name: Validate tagged AppImage
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: cargo run -p xtask -- check-appimage --tag "$GITHUB_REF_NAME"

      - name: Validate manually dispatched AppImage
        if: github.event_name == 'workflow_dispatch'
        run: cargo run -p xtask -- check-appimage

      - name: Smoke test AppImage startup
        run: |
          appimage=$(find target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage')
          set +e
          timeout 15s xvfb-run -a env APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" >appimage-startup.log 2>&1
          status=$?
          set -e
          test "$status" -eq 124 || { cat appimage-startup.log; exit 1; }

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  release:
    name: Publish tag release
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download AppImage
        uses: actions/download-artifact@v4
        with:
          name: linux-appimage

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./*.AppImage --clobber
          else
            gh release create "$GITHUB_REF_NAME" ./*.AppImage --verify-tag --generate-notes
          fi
