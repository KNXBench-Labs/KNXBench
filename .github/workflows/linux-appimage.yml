name: Linux AppImage

# AppImages are built at releases only: a version tag, or a deliberate manual dispatch to
# prepare one. Never add branch pushes or pull_request triggers (xtask check-appimage).
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build AppImage
    # Keep the packaged glibc baseline stable when ubuntu-latest advances.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils \
            build-essential \
            curl \
            file \
            iproute2 \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            python3 \
            squashfs-tools \
            util-linux \
            wget \
            weston \
            x11-apps \
            x11-utils \
            xauth \
            xvfb

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      # The legacy browser download endpoint can return 504 after a costly compile.
      # Fetch immutable API assets first, and verify bytes before making them executable.
      - name: Prepare pinned AppImage tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p target/.tauri
          fetch_tool() {
            local asset="$1" digest="$2" name="$3"
            local temporary="target/.tauri/$name.part"
            gh api -H 'Accept: application/octet-stream' "$asset" > "$temporary"
            printf '%s  %s\n' "$digest" "$temporary" | sha256sum --check
            chmod 755 "$temporary"
            mv "$temporary" "target/.tauri/$name"
          }
          fetch_tool repos/tauri-apps/binary-releases/releases/assets/274691722 \
            f30140a43a0a59e46db21bdefdf749b9e9f2c6946e92afabbacf98b8ae73fb4f AppRun-x86_64
          fetch_tool repos/tauri-apps/binary-releases/releases/assets/182515537 \
            e762bea85c8eb0d4b3508d46e5c1f037f717d0f9303ae3b4aafc8b04991fa1ef linuxdeploy-x86_64.AppImage
          fetch_tool repos/linuxdeploy/linuxdeploy-plugin-appimage/releases/assets/602435573 \
            49d6a17160675a6bd1781699aae6bdf7692d98552e02a3671d2183d10547842e linuxdeploy-plugin-appimage.AppImage

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked

      - name: Install frontend dependencies
        run: npm ci --prefix apps/knx-web

      - name: Check frontend native binding
        working-directory: apps/knx-web
        run: node --input-type=module -e "await import('rolldown'); console.log('Rolldown native binding loaded')"

      - name: Test AppImage launcher policy
        run: python3 -m unittest tools.tests.test_appimage_launcher tools.tests.test_appimage_frontend_binding tools.tests.test_appimage_glibc tools.tests.test_appimage_extraction -v

      - name: Build AppImage
        working-directory: apps/knx-desktop
        env:
          NO_STRIP: "1"
        run: APPIMAGE_EXTRACT_AND_RUN=1 cargo tauri build --bundles appimage --ci

      - name: Verify host-provided libraries are not bundled
        run: tools/appimage/check-host-libraries.sh target/release/bundle/appimage/*.AppImage

      - name: Verify finished AppImage permissions
        run: tools/appimage/check-permissions.sh target/release/bundle/appimage/*.AppImage

      - name: Verify AppImage glibc baseline
        run: python3 tools/check_appimage_glibc.py target/release/bundle/appimage/*.AppImage --max-version 2.39

      - name: Validate tagged AppImage
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: cargo run -p xtask -- check-appimage --tag "$GITHUB_REF_NAME"

      - name: Validate manually dispatched AppImage
        if: github.event_name == 'workflow_dispatch'
        run: cargo run -p xtask -- check-appimage

      - name: Smoke test AppImage startup
        run: |
          appimage=$(find target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage')
          set +e
          timeout 15s xvfb-run -a env -u WAYLAND_DISPLAY -u XDG_SESSION_TYPE -u GDK_BACKEND -u WEBKIT_DISABLE_DMABUF_RENDERER APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" >appimage-startup.log 2>&1
          status=$?
          set -e
          test "$status" -eq 124 || { cat appimage-startup.log; exit 1; }

      - name: Smoke test native Wayland startup
        run: |
          appimage=$(find target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage')
          export XDG_RUNTIME_DIR=$(mktemp -d)
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --renderer=pixman --shell=kiosk-shell.so \
            --no-config --socket=knxbench-ci --idle-time=0 >weston-startup.log 2>&1 &
          weston_pid=$!
          trap 'kill "$weston_pid" 2>/dev/null || true; wait "$weston_pid" 2>/dev/null || true; rm -rf "$XDG_RUNTIME_DIR"' EXIT
          for attempt in $(seq 1 100); do
            test -S "$XDG_RUNTIME_DIR/knxbench-ci" && break
            kill -0 "$weston_pid" || { cat weston-startup.log; exit 1; }
            sleep 0.1
          done
          test -S "$XDG_RUNTIME_DIR/knxbench-ci"
          set +e
          timeout 15s env -u DISPLAY -u GDK_BACKEND -u WEBKIT_DISABLE_DMABUF_RENDERER \
            WAYLAND_DISPLAY=knxbench-ci APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" >appimage-wayland.log 2>&1
          status=$?
          set -e
          test "$status" -eq 124 || { cat appimage-wayland.log; exit 1; }

      # Image owner is the runner; the app runs as another uid, offline (loopback only), with a
      # fresh private HOME/XDG, under Xvfb. The WebKit sandbox stays enabled.
      - name: Smoke test AppImage as another user, offline
        run: sudo python3 tools/appimage/smoke_cross_user.py target/release/bundle/appimage/*.AppImage

      - name: Upload cross-user smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appimage-smoke-evidence
          path: appimage-smoke/
          if-no-files-found: ignore

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      # ADR-0090: the read-only MCP server ships as its own binary beside the
      # AppImage. It links neither the bus nor any HTTP stack
      # (`cargo xtask check-layering`).
      - name: Build knx-mcp
        run: |
          cargo build --release --locked -p knx-mcp
          mkdir -p dist
          cp target/release/knx-mcp dist/knx-mcp-x86_64-linux
          dist/knx-mcp-x86_64-linux --version
          dist/knx-mcp-x86_64-linux --help >/dev/null

      - name: Upload knx-mcp
        uses: actions/upload-artifact@v4
        with:
          name: linux-knx-mcp
          path: dist/knx-mcp-x86_64-linux
          if-no-files-found: error

  release:
    name: Publish tag release
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download AppImage
        uses: actions/download-artifact@v4
        with:
          name: linux-appimage

      - name: Download knx-mcp
        uses: actions/download-artifact@v4
        with:
          name: linux-knx-mcp

      - name: Checksums
        run: |
          chmod +x knx-mcp-x86_64-linux
          sha256sum ./*.AppImage knx-mcp-x86_64-linux > SHA256SUMS
          cat SHA256SUMS

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # A tag with a pre-release part (v0.1.0-alpha.6) must never become the
        # repository's "Latest" full release. A release written by hand before
        # this job finishes keeps its notes; only the assets are attached.
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./*.AppImage knx-mcp-x86_64-linux SHA256SUMS --clobber
          else
            title="KNXBench $GITHUB_REF_NAME"
            kind=()
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              title="$title (pre-release)"
              kind=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" ./*.AppImage knx-mcp-x86_64-linux SHA256SUMS \
              --verify-tag --generate-notes --title "$title" "${kind[@]}"
          fi
