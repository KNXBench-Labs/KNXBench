[workspace]
resolver = "2"
members = [
    "crates/knx-core",
    "crates/knx-app",
    "crates/knx-store",
    "crates/knx-etsproj",
    "crates/knx-productdb",
    "crates/knx-projection",
    "crates/knx-csv",
    "crates/knx-diff",
    "crates/knx-report",
    "crates/knx-net",
    "crates/knx-secure",
    "crates/knx-testsupport",
    "crates/knx-build-stamp",
    "apps/knx-cli",
    "apps/knx-desktop/src-tauri",
    "apps/knx-server",
    "apps/knx-mcp",
    "xtask",
]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/KNXBench-Labs/KNXBench"
rust-version = "1.98.0"

[workspace.dependencies]
knx-core = { path = "crates/knx-core" }
knx-app = { path = "crates/knx-app" }
knx-store = { path = "crates/knx-store" }
knx-etsproj = { path = "crates/knx-etsproj" }
knx-productdb = { path = "crates/knx-productdb" }
knx-projection = { path = "crates/knx-projection" }
knx-csv = { path = "crates/knx-csv" }
knx-diff = { path = "crates/knx-diff" }
knx-report = { path = "crates/knx-report" }
knx-net = { path = "crates/knx-net" }
knx-secure = { path = "crates/knx-secure" }
knx-testsupport = { path = "crates/knx-testsupport" }
knx-build-stamp = { path = "crates/knx-build-stamp" }
knx-server = { path = "apps/knx-server" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rustix = { version = "1.1", features = ["fs"] }
tempfile = "3"
tauri = "2.11"
tauri-build = "2.6"
tauri-plugin-dialog = "2.7"
# The desktop shell's only use is observing WebKit's `web-process-terminated`
# signal (KNOWN_LIMITATIONS §133): `tauri` hands out the native
# `webkit2gtk::WebView` but no way to name its signal trait. Already resolved
# at this exact version through `wry`, so depending on it directly adds an
# edge, not a crate. Linux-only in the one crate that uses it.
webkit2gtk = "2.0"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
crc32fast = "1"
# Decompresses a ZipCrypto entry's compressed data once knx-secure has
# stripped its encryption layer (Container::open_with_password): the zip
# crate's own compression handling is fused to its own crypto handling,
# so a hand-rolled decrypt path needs its own decompressor. Already in
# the dependency tree transitively via zip's `deflate-flate2-zlib-rs`
# feature; this just names it directly instead of relying on that.
flate2 = "1"
quick-xml = "0.42"
csv = "1"
sha2 = "0.10"
pbkdf2 = "0.12"
base64 = "0.22"
# The operating system's CSPRNG and nothing else: no generator state, no
# seeding, no `rand` distribution machinery. Already resolved in this
# workspace as a transitive dependency of `tempfile` and `uuid`, so
# depending on it directly adds an edge, not a crate.
getrandom = "0.4"
# `knx-server` terminates TLS itself (ADR-0088). `ring` is the crypto
# provider throughout, chosen over rustls' default `aws-lc-rs` because the
# latter's `aws-lc-sys` carries the OpenSSL licence, which `deny.toml` does
# not allow. Every crate below is pinned to that provider explicitly so no
# default feature can quietly pull the other one back in.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
# Reads a certificate's validity window. Already resolved through `rcgen`
# at this version and with this feature; naming it adds an edge, not a crate.
yasna = { version = "0.6", features = ["time"] }
time = "0.3"
socket2 = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml-rust2 = { version = "0.13", default-features = false }
ts-rs = "12"
axum = "0.8"
tokio = "1"
# Official Rust MCP SDK, only for `apps/knx-mcp` (ADR-0090). Reduced to the
# stdio server: no HTTP transport, no auth/OAuth, no client.
rmcp = { version = "3.5.1", default-features = false, features = ["server", "macros", "transport-io"] }
tower = "0.5"
tower-http = "0.6"
