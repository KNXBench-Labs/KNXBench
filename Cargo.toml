[workspace]
resolver = "2"
members = [
    "crates/knx-core",
    "crates/knx-app",
    "crates/knx-store",
    "crates/knx-etsproj",
    "crates/knx-productdb",
    "crates/knx-net",
    "crates/knx-secure",
    "apps/knx-cli",
    "xtask",
]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/KNXBench-Labs/KNX"
rust-version = "1.98.0"

[workspace.dependencies]
knx-core = { path = "crates/knx-core" }
knx-app = { path = "crates/knx-app" }
knx-store = { path = "crates/knx-store" }
knx-etsproj = { path = "crates/knx-etsproj" }
knx-productdb = { path = "crates/knx-productdb" }
knx-net = { path = "crates/knx-net" }
knx-secure = { path = "crates/knx-secure" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = "0.42"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
