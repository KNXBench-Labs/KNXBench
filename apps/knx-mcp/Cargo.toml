knx-csv.workspace = true
knx-diff.workspace = true
knx-edit.workspace = true
knx-productdb.workspace = true
knx-projection.workspace = true
knx-store.workspace = true
chrono.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "io-std"] }

[dev-dependencies]
tempfile.workspace = true
knx-testsupport.workspace = true

[build-dependencies]
knx-build-stamp.workspace = true
