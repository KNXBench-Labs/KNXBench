[package]
name = "knx-server"
version = "0.1.0-alpha.7"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "knx-server"
path = "src/main.rs"

[lib]
name = "knx_server"
path = "src/lib.rs"

[dependencies]
http-body = "1"
knx-app.workspace = true
knx-core.workspace = true
knx-csv.workspace = true
knx-diff.workspace = true
knx-etsproj.workspace = true
knx-net.workspace = true
knx-projection.workspace = true
knx-productdb.workspace = true
knx-report.workspace = true
knx-store.workspace = true
chrono.workspace = true
axum = { workspace = true, features = ["multipart"] }
tokio = { workspace = true, features = ["full"] }
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true, features = ["fs"] }
serde.workspace = true
serde_json.workspace = true
# The login credential: PBKDF2-HMAC-SHA256 over a random salt, stored in a
# PHC-style string (ADR-0026). All three are already workspace
# dependencies — `knx-secure` uses the same trio for `.knxkeys` — so
# authentication cost this workspace no new third-party code.
pbkdf2.workspace = true
sha2.workspace = true
base64.workspace = true
# Session tokens, straight from the operating system's CSPRNG. Already in
# the resolved graph via `tempfile`; naming it directly buys a documented
# source of randomness instead of a hand-rolled one.
getrandom.workspace = true
# HTTPS on the server's own port, with a self-signed certificate as the
# zero-configuration default (ADR-0088). `ring` only; see the workspace
# manifest for why.
rustls.workspace = true
tokio-rustls.workspace = true
rcgen.workspace = true
yasna.workspace = true
time.workspace = true
tempfile.workspace = true
language-tags = "0.3.2"
zip.workspace = true

[dev-dependencies]
http-body-util = "0.1"
knx-testsupport.workspace = true
rusqlite.workspace = true
# Paused clock for the stop-grace tests.
tokio = { workspace = true, features = ["test-util"] }

[build-dependencies]
knx-build-stamp.workspace = true
