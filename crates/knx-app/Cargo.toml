[package]
name = "knx-app"
version = "0.1.0-alpha.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
knx-core.workspace = true
knx-etsproj.workspace = true
knx-productdb.workspace = true
knx-report.workspace = true
knx-store.workspace = true
chrono.workspace = true
# Decodes `DeviceInstance/@SerialNumber` (xs:base64Binary) in `serial_number`.
base64.workspace = true
# `download_support` reads its shipped evidence file, `data/verified_downloads.json`.
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
knx-testsupport.workspace = true
# Only `tests/csv_roundtrip.rs` needs this — no production `knx-app` code
# calls into `knx-csv` yet (that is a later task's job). `knx-app` is
# deliberately the one crate allowed to see both `knx-etsproj` and a CSV
# writer that must itself never depend on `knx-etsproj` — see that test's
# own doc comment.
knx-csv.workspace = true
# Only `tests/documentation_export.rs` needs this, for the same reason:
# `knx-report` must itself never depend on `knx-etsproj`, and `knx-app` is
# the one crate allowed to see both.
# Only `tests/project_diff.rs` needs this, for the same reason again:
# `knx-diff` must itself never depend on `knx-etsproj`, and `knx-app` is
# the one crate allowed to see both.
knx-diff.workspace = true
# Only `tests/perf_baseline.rs` needs this: the `--ignored` performance
# baseline times `knx_projection::build_project_tree` alongside import,
# open, search and export. No production `knx-app` code builds a
# projection yet — that is the desktop/web UI's job, one layer up.
knx-projection.workspace = true
