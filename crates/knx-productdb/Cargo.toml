[package]
name = "knx-productdb"
version = "0.1.0-alpha.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
knx-core.workspace = true
# `backup`: `open_read_only` copies an older database into memory and
# migrates the copy, never the file (ADR-0090). A feature flag, no new crate.
rusqlite = { workspace = true, features = ["backup"] }
quick-xml.workspace = true
sha2.workspace = true
# Local procedure-resolution reports use the existing workspace serialization contract.
serde.workspace = true
# Canonical format-2 report accounting uses the same serializer as the CLI.
serde_json.workspace = true
zip.workspace = true
crc32fast.workspace = true
# Decodes `AbsoluteSegment/Data` and `/Mask` (xs:base64Binary) in `code`.
# Already a workspace dependency via knx-secure.
base64.workspace = true
# Inflates a legacy EX-IM member (ADR-0094). Decryption is not done here:
# knx-productdb must not link knx-secure (knx-mcp, ADR-0090).
flate2.workspace = true
# Fresh 128-bit catalogue incarnation (WP-04.3 stage B, ADR-0150).
getrandom.workspace = true
# Typed no-clobber recovery publication; already locked in this workspace.
rustix.workspace = true

[dev-dependencies]
# Linux wait4 ABI for the opt-in measurement supervisor; already locked transitively.
libc = "=0.2.189"
tempfile.workspace = true
knx-testsupport.workspace = true

# Keep opt-in measurement regressions in the package's maintained test inventory.
[[example]]
name = "productdb_measure"
test = true

[[example]]
name = "productdb_observe"
test = true
