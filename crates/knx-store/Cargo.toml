[package]
name = "knx-store"
version = "0.1.0-alpha.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
chrono.workspace = true
knx-core.workspace = true
sha2.workspace = true
# `backup`: `open_existing_read_only` copies an older store into memory and
# migrates the copy, never the file (ADR-0090). A feature flag, no new crate.
rusqlite = { workspace = true, features = ["backup", "serialize"] }

[dev-dependencies]
# Test-only: `tests/reference_project.rs` round-trips the real reference
# `.knxproj` through save_project/load_project, which needs the importer to
# produce the `Project` in the first place. Not a layering violation —
# `check-layering` forbids `knx-etsproj` depending on storage, not the
# reverse, and a dev-dependency never enters the production graph.
knx-etsproj.workspace = true
tempfile.workspace = true
knx-testsupport.workspace = true
