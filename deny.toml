# Licence policy. The hard constraint is RESEARCH R6: no GPL-licensed crate may
# enter the runtime dependency graph. With the version 2 licence engine, any
# licence not listed in `allow` is denied, so the allowlist below is the policy
# — there is no separate deny list to keep in sync.

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
]
# Our own crates are `publish = false` and carry the workspace licence, which is
# deliberately not on the allowlist above: the allowlist is policy for incoming
# third-party code, not for this repository's own licence.
private = { ignore = true }

[bans]
multiple-versions = "warn"
# No `foo = "*"` version requirements. Path dependencies inside this workspace
# have no version requirement by design and are exempt.
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
version = 2
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
