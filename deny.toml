# Licence policy. The hard constraint is RESEARCH R6: no GPL-licensed crate may
# enter the runtime dependency graph. With the version 2 licence engine, any
# licence not listed in `allow` is denied, so the allowlist below is the policy
# — there is no separate deny list to keep in sync.

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
]
# Our own crates are `publish = false` and carry the workspace licence, which is
# deliberately not on the allowlist above: the allowlist is policy for incoming
# third-party code, not for this repository's own licence.
private = { ignore = true }

[bans]
multiple-versions = "warn"
# No `foo = "*"` version requirements. Path dependencies inside this workspace
# have no version requirement by design and are exempt.
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
version = 2
yanked = "deny"
# These six notices are "unmaintained", not vulnerabilities, and are all
# transitive dependencies of Tauri 2.11 on Linux. Reviewed 2026-09-22:
#  - RUSTSEC-2024-0370: accepted because `proc-macro-error` arrives through
#    Tauri's `muda`/GTK stack and has no patched release.
#  - RUSTSEC-2025-0075: accepted because `unic-char-range` arrives through
#    `urlpattern`/`tauri-utils` and has no patched release.
#  - RUSTSEC-2025-0080: accepted because `unic-common` arrives through
#    `urlpattern`/`tauri-utils` and has no patched release.
#  - RUSTSEC-2025-0081: accepted because `unic-char-property` arrives through
#    `urlpattern`/`tauri-utils` and has no patched release.
#  - RUSTSEC-2025-0098: accepted because `unic-ucd-version` arrives through
#    `urlpattern`/`tauri-utils` and has no patched release.
#  - RUSTSEC-2025-0100: accepted because `unic-ucd-ident` arrives through
#    `urlpattern`/`tauri-utils` and has no patched release.
# Re-check every acceptance whenever `tauri`/`tauri-*` is bumped.
ignore = [
    "RUSTSEC-2024-0370",
    "RUSTSEC-2025-0075", "RUSTSEC-2025-0080", "RUSTSEC-2025-0081",
    "RUSTSEC-2025-0098", "RUSTSEC-2025-0100",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
